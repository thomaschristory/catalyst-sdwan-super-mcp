name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check sdwan_mcp tests
      - name: Ruff format check
        run: uv run ruff format --check sdwan_mcp tests
      - name: Mypy strict
        run: uv run mypy --strict sdwan_mcp
