name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check sdwan_mcp tests
      - name: Ruff format check
        run: uv run ruff format --check sdwan_mcp tests
      - name: Mypy strict
        run: uv run mypy --strict sdwan_mcp
